    <path d="M-28 23 42 8 28 20Z" fill="#38BDF8" />
    <path d="M-20 36 6 30 6 34Z" fill="#171B22" />

    <!-- KAZE：紧凑排列 -->

    <!-- K -->
    <g fill="#171B22">
      <path d="M0 10 16 0V88H0Z" />
      <path d="M17 39 45 0H65L33 44 67 88H46L17 50Z" />
    </g>
    <path d="M33 44 67 88H46L24 57Z" fill="#38BDF8" />

    <!-- A -->
    <g transform="translate(74)" fill="#171B22">
      <path
        fill-rule="evenodd"
        d="M0 88 23 0H43L66 88H49L44 68H22L17 88ZM26 52H40L33 22Z"
      />
    </g>

    <!-- Z -->
    <g transform="translate(148)">

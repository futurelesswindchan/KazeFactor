      <path d="M0 0H66L54 16H0Z" fill="#38BDF8" />
      <path d="M54 16 66 0V13L47 38Z" fill="#0284C7" />
    </g>

    <!-- E -->
    <g transform="translate(222)" fill="#171B22">
      <path d="M0 0H64L52 16H17V35H53L42 51H17V72H64L52 88H0Z" />
    </g>

    <!-- FACTOR：与 KAZE 留出明显空格 -->

    <!-- F -->
    <g transform="translate(332)">
      <path d="M0 0H64L52 16H17V35H52L41 51H17V88H0Z" fill="#171B22" />
      <path d="M17 35H52L41 51H17Z" fill="#38BDF8" />
    </g>

    <!-- A -->
    <g transform="translate(404)" fill="#171B22">
      <path
        fill-rule="evenodd"
        d="M0 88 23 0H43L66 88H49L44 68H22L17 88ZM26 52H40L33 22Z"
      />
    </g>

    <!-- C -->
    <g transform="translate(478)" fill="#171B22">
      <path d="M17 0H65L53 16H24L17 23V65L24 72H65L53 88H17L0 71V17Z" />
    </g>

    <!-- T -->
    <g transform="translate(550)" fill="#171B22">

name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 Tag 名称（例如 v1.0.0）'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: 单元测试 · 编译签名 · 发布溯源
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出源码 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 配置 JDK 21 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. 配置 Gradle 缓存与执行权限
        uses: gradle/actions/setup-gradle@v4

      - name: 4. 赋予 gradlew 执行权限并接受 Android SDK 许可
        run: |
          chmod +x ./gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. 运行全量单元测试 (core-domain + core-engine + app)
        run: ./gradlew :core-domain:test :core-engine:test :app:testDebugUnitTest --console=plain

      - name: 6. 解码签名密钥库 (Keystore)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "::error::未检测到 SIGNING_KEY_BASE64 Secret，请先在仓库 Settings -> Secrets and variables -> Actions 中配置！"
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: 7. 构建并签名正式版 APK (assembleRelease)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 8. 整理 APK 文件名并计算 SHA-256 指纹
        id: package
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          APK_DIR="app/build/outputs/apk/release"
          APK_SRC=$(find "$APK_DIR" -name "*.apk" | head -n 1)

          if [ -z "$APK_SRC" ]; then
            echo "::error::未找到构建产出的 Release APK 文件！"
            exit 1
          fi

          OUT_APK="KazeFactor-${RAW_TAG}.apk"
          cp "$APK_SRC" "$OUT_APK"
          sha256sum "$OUT_APK" > "${OUT_APK}.sha256"

          echo "tag_name=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${OUT_APK}" >> "$GITHUB_OUTPUT"
          echo "sha_file=${OUT_APK}.sha256" >> "$GITHUB_OUTPUT"

      - name: 9. 生成 GitHub 官方加密构建溯源证书 (Build Provenance Attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.apk_file }}

      - name: 10. 上传构建产物至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          files: |
            ${{ steps.package.outputs.apk_file }}
            ${{ steps.package.outputs.sha_file }}

      - name: 11. 清理临时签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"
